# Builds the BioCraft installers on GitHub's machines: Windows (NSIS setup .exe), macOS (universal
# .dmg, Apple silicon and Intel) and Linux (deb, AppImage), each with the icon library inside — the
# same packages tools/package/build-windows.ps1 and build-mac.sh make.
#
# The library is not in git (about 640 MB): zip library/index.json and library/packs into
# biocraft-library.zip (with the folder library/ in the zip) and attach it to a GitHub release
# tagged "library". Then "Run workflow" (Actions tab) builds the installers as artifacts of the run.
# It only runs when started by hand. The Windows installer is built locally for now
# (tools/package/build-windows.ps1) and attached to releases, so a release needs only the macOS one:
#   gh workflow run build.yml -f platforms=macOS
name: Build desktop app

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Installers to build
        type: choice
        options: [all, macOS, Windows, Linux]
        default: all

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # the platforms asked for, named as runner.os names them (made from the input: an include
        # list can't be filtered, as an entry that matches nothing is added back as a job of its own)
        os: ${{ fromJSON(inputs.platforms == 'all' && '["Windows", "macOS", "Linux"]' || format('["{0}"]', inputs.platforms)) }}
    runs-on: ${{ fromJSON('{"Windows":"windows-latest","macOS":"macos-latest","Linux":"ubuntu-22.04"}')[matrix.os] }}
    steps:
      - uses: actions/checkout@v4

      - name: Icon library (the "library" release's biocraft-library.zip)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download library --pattern biocraft-library.zip --repo "$GITHUB_REPOSITORY"
          unzip -q biocraft-library.zip
          rm biocraft-library.zip
          test -f library/index.json

      - name: Linux system libraries (WebKitGTK, GTK for file dialogs)
        if: matrix.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Core tests
        run: cargo test -p biocanvas-core

      - name: Third-party notices (shipped with the installers)
        run: node tools/package/notices.mjs

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tauriScript: npx --yes @tauri-apps/cli@2
          args: ${{ fromJSON('{"Windows":"--bundles nsis","macOS":"--target universal-apple-darwin --bundles dmg","Linux":"--bundles deb,appimage"}')[matrix.os] }} --config tauri.installer.json
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: BioCraft ${{ github.ref_name }}
          releaseBody: Installers for Windows, macOS and Linux, with the icon library inside.
          releaseDraft: true

      - uses: actions/upload-artifact@v4
        with:
          name: biocraft-${{ matrix.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore

      # (after the upload, so a failure here still leaves the .dmg to look at)
      - name: Check the .dmg (the app in it runs, is universal and signed, and finds its library)
        if: matrix.os == 'macOS'
        shell: bash
        working-directory: ${{ runner.temp }} # (not the checkout: its library/ must not be found instead)
        run: |
          mkdir dmg
          hdiutil attach -nobrowse -readonly -mountpoint "$PWD/dmg" "$GITHUB_WORKSPACE"/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          app=$PWD/dmg/BioCraft.app
          plist=$app/Contents/Info.plist
          exe=$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$plist")
          lipo -archs "$exe"
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" -c "Print :CFBundleDocumentTypes" "$plist"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app"
          test -f "$app/Contents/Resources/THIRD-PARTY-NOTICES.txt"
          echo "$(find "$app/Contents/Resources/library/packs" -type f | wc -l) library files"
          "$exe" --version
          "$exe" search mitochondria --limit 1 > search.json
          cat search.json
          "$exe" icon "$(jq -r '.items[0].id' search.json)" --png icon.png
          file icon.png
          hdiutil detach "$PWD/dmg"
