# Builds the BioCraft installers on GitHub's machines: Windows (NSIS setup .exe), macOS (universal
# .dmg, Apple silicon and Intel) and Linux (deb, AppImage), each with the icon library inside — the
# same packages tools/package/build-windows.ps1 and build-mac.sh make.
#
# The library is not in git (about 640 MB): zip library/index.json and library/packs into
# biocraft-library.zip (with the folder library/ in the zip) and attach it to a GitHub release
# tagged "library". Then "Run workflow" (Actions tab) builds the installers as artifacts of the run.
# It only runs when started by hand: the Windows installer is built locally for now
# (tools/package/build-windows.ps1) and attached to releases.
name: Build desktop app

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis"
          - platform: macos-latest
            args: "--target universal-apple-darwin --bundles dmg"
          - platform: ubuntu-22.04
            args: "--bundles deb,appimage"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Icon library (the "library" release's biocraft-library.zip)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download library --pattern biocraft-library.zip --repo "$GITHUB_REPOSITORY"
          unzip -q biocraft-library.zip
          rm biocraft-library.zip
          test -f library/index.json

      - name: Linux system libraries (WebKitGTK, GTK for file dialogs)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Core tests
        run: cargo test -p biocanvas-core

      - name: Third-party notices (shipped with the installers)
        run: node tools/package/notices.mjs

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tauriScript: npx --yes @tauri-apps/cli@2
          args: ${{ matrix.args }} --config tauri.installer.json
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: BioCraft ${{ github.ref_name }}
          releaseBody: Installers for Windows, macOS and Linux, with the icon library inside.
          releaseDraft: true

      - uses: actions/upload-artifact@v4
        with:
          name: biocraft-${{ matrix.platform }}
          path: |
            target/release/bundle/nsis/*.exe
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore
